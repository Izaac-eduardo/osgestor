map $http_x_osg_forwarded_proto $trusted_forwarded_proto {
    default http;
    https https;
}

map $http_x_osg_client_ip $trusted_client_ip {
    default $http_x_osg_client_ip;
    "" $remote_addr;
}

map $http_x_osg_forwarded_host $trusted_forwarded_host {
    default $http_x_osg_forwarded_host;
    "" $host;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;

    location ~ ^/(auth|health|admin|auditoria|obras|funcionarios|ordens-servico|prefixos-frota|frotas|relatorios|dashboard|importacoes-os|abastecimento)(/|$) {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $trusted_forwarded_host;
        proxy_set_header X-Real-IP $trusted_client_ip;
        proxy_set_header X-Forwarded-For $trusted_client_ip;
        proxy_set_header X-Forwarded-Proto $trusted_forwarded_proto;
        proxy_set_header X-Forwarded-Host $trusted_forwarded_host;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
